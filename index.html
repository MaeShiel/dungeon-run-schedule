<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Run Schedule</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1b22;--muted:#6b6776;--line:#dedae3;--accent:#6d3fd1;--accent-ink:#fff;--good:#1f8a4c;--warn:#a85a08;--cell:#ece9f1}
@media(prefers-color-scheme:dark){:root{--bg:#15131b;--card:#1f1c28;--ink:#eeeaf6;--muted:#a09ab0;--line:#342f42;--accent:#9a75f0;--accent-ink:#15131b;--good:#3fae72;--warn:#e6a04a;--cell:#2a2636}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
.clocks{display:flex;gap:8px}
.clock{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--muted)}
.clock b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.clock.mine{border-color:var(--accent)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
input,select,button{font:inherit;color:var(--ink);border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:7px 10px;min-height:36px}
input{min-width:0}
button{cursor:pointer;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
button.small{min-height:30px;padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
.hint,.empty{color:var(--muted);font-size:13px;margin:0 0 10px}
.empty{margin:4px 0 12px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item .row{margin-top:8px}
.title{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.pill{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good);color:#fff}
.pill.soft{background:var(--cell);color:var(--ink)}
.dual{margin-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.dual div{color:var(--muted)}
.dual .mine{color:var(--ink);font-weight:600}
.zl{display:inline-block;min-width:88px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.who{font-size:13px;color:var(--muted);margin-top:4px}
.note{font-size:13px;margin-top:4px}
h3{font-size:12px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
details.loot{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.loot summary{cursor:pointer;font-weight:600;font-size:14px}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) 60px 100px 96px 36px;gap:6px;margin-top:6px;align-items:center}
.lrow.add [data-n=name]{grid-column:1/3}
.lrow input,.lrow select{width:100%;min-width:0;min-height:32px;padding:4px 8px}
.lrow button{padding:4px 6px}
.lrow.lh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lrow.add button{grid-column:span 2}
.split,.sum{font-size:13px;margin-top:10px}
.split label,.sum label{display:inline-flex;align-items:center;margin:2px 0 2px 10px;cursor:pointer}
.sum b{font-variant-numeric:tabular-nums}
.sum .mine{color:var(--good);font-weight:600}
.thumb{width:56px;height:56px;min-height:0;padding:0;border:1px dashed var(--muted);border-radius:8px;background:var(--cell);color:var(--muted);font-size:18px;font-weight:400;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb.has{border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
@media(max-width:560px){
  .lrow{grid-template-columns:56px minmax(0,1fr) 96px 36px}
  .lrow [data-f=name],.lrow .ln{grid-column:2/-1}
  .lrow.add [data-n=name]{grid-column:1/-1}
  .lrow.lh{display:none}
}
form.row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
form.row input[type=text]{flex:1 1 150px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;border-radius:0;background:transparent;color:var(--ink);font-weight:500;min-height:32px}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.g{display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr)) 56px;gap:2px;user-select:none;-webkit-user-select:none}
.g.solo{grid-template-columns:38px repeat(7,minmax(0,1fr))}
input[type=checkbox]{min-height:0;padding:0;margin:0 4px 0 0;accent-color:var(--accent)}
.both{display:inline-flex;align-items:center;margin-top:6px;cursor:pointer}
.gh{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.gt{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-variant-numeric:tabular-nums}
.gt.o{justify-content:flex-start;padding:0 0 0 4px;gap:3px}
.gt small{font-size:9px;opacity:.8}
.c{border:0;border-radius:4px;background:var(--cell);height:26px;min-height:0;padding:0;font-size:11px;font-weight:600;color:var(--ink);touch-action:manipulation}
.c.on{background:var(--accent)}
.c.full{background:var(--good);color:#fff}
.c:disabled{opacity:.6}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--cell);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{min-height:0;padding:0 6px;background:transparent;color:var(--muted);border:0;font-weight:400}
.lrow.ro{font-size:14px}
.lrow.ro .muted{color:var(--muted);font-size:13px}
.split select{min-height:30px;padding:3px 8px;margin-left:6px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(340px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
#pinInput{width:100%;font-size:22px;letter-spacing:.4em;text-align:center}
#pinErr{color:var(--warn);font-size:13px;min-height:18px;margin:6px 0 0}
.foot{text-align:center;margin:0 0 20px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;max-width:90vw}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Dungeon Run Schedule</h1>
      <p class="sub" id="sub"></p>
      <label class="sub both"><input type="checkbox" id="both"> Also show the other time zone</label>
    </div>
    <div class="clocks" id="clocks"></div>
  </header>

  <div class="banner" id="banner" hidden>Preview mode: everything is saved only in this browser. Teammates cannot see it until the shared database is connected.</div>

  <section class="card">
    <div class="head"><h2>Who are you?</h2></div>
    <div class="row">
      <select id="who" aria-label="Your name"></select>
      <span class="chips" id="myClasses"></span>
      <select id="myClass" aria-label="Add a Flyff class you play"></select>
      <button class="ghost small" id="removeMe" type="button">Remove</button>
      <span class="grow"></span>
      <input id="newName" type="text" placeholder="New player name" maxlength="24" aria-label="New player name">
      <button id="addPlayer" type="button">Add player</button>
    </div>
    <p class="hint" id="whoHint" style="margin:10px 0 0"></p>
  </section>

  <section class="card">
    <div class="head"><h2>Upcoming runs</h2></div>
    <div id="runs"></div>
    <form class="row" id="runForm">
      <input type="text" id="runName" placeholder="Dungeon name" maxlength="40" aria-label="Dungeon name">
      <input type="datetime-local" id="when" required aria-label="Start time in your local time">
      <input type="text" id="runNote" placeholder="Note (optional)" maxlength="80" aria-label="Note">
      <select id="runLeader" aria-label="Leader of this run"></select>
      <button type="submit">Create run</button>
    </form>
    <div id="whenPreview"></div>
  </section>

  <section class="card">
    <div class="head">
      <h2>Best times in the next 7 days</h2>
      <label class="row" style="font-size:13px">Need at least <select id="need"></select> players</label>
    </div>
    <div id="best"></div>
  </section>

  <section class="card">
    <div class="head">
      <h2>Weekly hours</h2>
      <div class="tabs"><button type="button" data-mode="my">My hours</button><button type="button" data-mode="team">Team</button></div>
    </div>
    <p class="hint" id="gridHint"></p>
    <div id="grid"></div>
    <div class="row" style="margin-top:10px"><button class="ghost small" id="clearMine" type="button">Clear my hours</button></div>
  </section>
  <div class="foot"><button class="ghost small" id="ownerBtn" type="button" hidden>Set owner PIN</button></div>
</main>
<dialog id="pinDlg">
  <form id="pinForm">
    <h2 id="pinTitle"></h2>
    <p class="hint" id="pinText" style="margin:6px 0 12px"></p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="4-digit PIN">
    <p id="pinErr"></p>
    <div class="row">
      <button type="submit">OK</button>
      <button type="button" class="ghost" id="pinCancel">Cancel</button>
      <span class="grow"></span>
      <button type="button" class="ghost small" id="pinForgot" hidden>Forgot PIN</button>
    </div>
  </form>
</dialog>
<div id="toast" hidden></div>
<input type="file" id="picInput" accept="image/*" hidden>
<datalist id="itemNames"></datalist>

<script>
// Shared database settings. Leave empty to run in preview mode (this browser only).
const CONFIG = { supabaseUrl: "https://efolmrzvpqktgmyvgndq.supabase.co", supabaseKey: "sb_publishable_0AGjUaATE6yhshPuoNThPA_QSCNGmfw" };

const FARGO = "America/Chicago", PH = "Asia/Manila", HOUR = 3600e3;
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
// Flyff Universe classes, grouped by job tier.
const CLASSES = [
  ["Second job", ["Blade", "Knight", "Jester", "Ranger", "Ringmaster", "Billposter", "Psykeeper", "Elementor"]],
  ["Third job", ["Slayer", "Templar", "Harlequin", "Crackshooter", "Seraph", "Force Master", "Mentalist", "Arcanist"]],
  ["First job", ["Mercenary", "Acrobat", "Assist", "Magician", "Vagrant"]],
];
const classOptions = (sel, blank) => `<option value="">${blank}</option>` + CLASSES.map(([g, list]) =>
  `<optgroup label="${g}">${list.map(c => `<option${c === sel ? " selected" : ""}>${c}</option>`).join("")}</optgroup>`).join("");
// A player can play several classes. They are stored as plain text, "Arcanist + Seraph".
const ALL_CLASSES = CLASSES.flatMap(([, list]) => list);
const splitCls = s => String(s || "").split(/\s*\+\s*/).filter(c => ALL_CLASSES.includes(c));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------- time zones ----------
function validTz(tz) { try { new Intl.DateTimeFormat("en-US", { timeZone: tz }); return tz; } catch { return FARGO; } }
const browserTz = validTz(Intl.DateTimeFormat().resolvedOptions().timeZone || FARGO);
const fmtCache = {};
function partsOf(ms, tz) {
  const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "short", hourCycle: "h23", hour: "2-digit", minute: "2-digit", year: "numeric", month: "2-digit", day: "2-digit" }));
  const o = {};
  for (const p of f.formatToParts(ms)) o[p.type] = p.value;
  return { dow: DOW.indexOf(o.weekday), hour: +o.hour % 24, minute: +o.minute, y: +o.year, m: +o.month, d: +o.day };
}
function offsetMin(tz, ms = Date.now()) {
  const p = partsOf(ms, tz);
  return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.hour, p.minute) - Math.floor(ms / 60000) * 60000) / 60000);
}
const viewerZone = offsetMin(browserTz) === offsetMin(PH) ? PH : offsetMin(browserTz) === offsetMin(FARGO) ? FARGO : null;
const otherTz = viewerZone === PH ? FARGO : PH;
const zoneName = tz => tz === PH ? "Philippines" : "Fargo";
const fmtWhen = (ms, tz) => new Date(ms).toLocaleString("en-US", { timeZone: tz, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const fmtClock = (ms, tz) => new Date(ms).toLocaleString("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" });
const hl = h => (h % 12 || 12) + (h < 12 ? "a" : "p");
// By default each viewer sees only their own local time. The checkbox in the header adds the other zone.
let showBoth = lsGet("drs.both") === "1";
const myTz = viewerZone || browserTz;
const myLabel = viewerZone ? zoneName(viewerZone) : "Your time";
function allZones() {
  const z = [[FARGO, "Fargo"], [PH, "Philippines"]];
  if (!viewerZone) z.unshift([browserTz, "Your time"]);
  return z;
}
const zones = () => showBoth ? allZones() : [[myTz, myLabel]];
const isMine = tz => tz === myTz;
function dualHtml(ms, end) {
  return '<div class="dual">' + zones().map(([tz, label]) =>
    `<div class="${isMine(tz) ? "mine" : ""}">${showBoth ? `<span class="zl">${label}</span> ` : ""}${fmtWhen(ms, tz)}${end ? " – " + fmtClock(end, tz) : ""}</div>`).join("") + "</div>";
}
// Invites go to the whole group chat, so they always list both zones.
function dualText(ms) { return allZones().map(([tz, label]) => `${label}: ${fmtWhen(ms, tz)}`).join("\n"); }

// ---------- storage ----------
const ITEM_ID = "_item:";
// PINs are also hidden rows in the runs table: id "_pin:<player id>", or "_pin:_owner" for the owner PIN.
const PIN_ID = "_pin:", OWNER = "_owner", EPOCH = "1970-01-01T00:00:00Z";
const remote = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
async function api(path, opts = {}) {
  const r = await fetch(CONFIG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/" + path, { ...opts, headers: { apikey: CONFIG.supabaseKey, "Content-Type": "application/json", ...(opts.headers || {}) } });
  const t = await r.text();
  if (!r.ok) throw new Error(t || r.statusText);
  return t ? JSON.parse(t) : null;
}
const upsert = { Prefer: "resolution=merge-duplicates,return=minimal" };
const remoteStore = {
  // Item pictures live in the runs table as hidden rows (id "_item:<name>") so no new table is needed.
  // They are left out of the regular load because they are large and rarely change.
  async load() { const [players, runs] = await Promise.all([api("players?select=*"), api("runs?select=*&id=not.like." + encodeURIComponent(ITEM_ID) + "*")]); return { players, runs }; },
  async loadItems() {
    const rows = await api("runs?select=id,classes&id=like." + encodeURIComponent(ITEM_ID) + "*"), out = {};
    for (const r of rows) out[r.id.slice(ITEM_ID.length)] = r.classes && r.classes._img;
    return out;
  },
  saveItem: (key, img) => api("runs", { method: "POST", headers: upsert, body: JSON.stringify({ id: ITEM_ID + key, name: key, start: "1970-01-01T00:00:00Z", note: "", members: [], classes: { _img: img } }) }),
  savePlayer: p => api("players", { method: "POST", headers: upsert, body: JSON.stringify(p) }),
  deletePlayer: id => api("players?id=eq." + encodeURIComponent(id), { method: "DELETE" }),
  saveRun: r => api("runs", { method: "POST", headers: upsert, body: JSON.stringify(r) }),
  deleteRun: id => api("runs?id=eq." + encodeURIComponent(id), { method: "DELETE" }),
};
const localStore = {
  read() { try { return JSON.parse(lsGet("drs.data")) || { players: [], runs: [] }; } catch { return { players: [], runs: [] }; } },
  put(list, item) { const i = list.findIndex(x => x.id === item.id); if (i < 0) list.push(item); else list[i] = item; },
  async load() { return this.read(); },
  async loadItems() { return this.read().items || {}; },
  async saveItem(key, img) { const d = this.read(); d.items = { ...(d.items || {}), [key]: img }; lsSet("drs.data", JSON.stringify(d)); },
  async savePlayer(p) { const d = this.read(); this.put(d.players, p); lsSet("drs.data", JSON.stringify(d)); },
  async deletePlayer(id) { const d = this.read(); d.players = d.players.filter(x => x.id !== id); lsSet("drs.data", JSON.stringify(d)); },
  async saveRun(r) { const d = this.read(); this.put(d.runs, r); lsSet("drs.data", JSON.stringify(d)); },
  async deleteRun(id) { const d = this.read(); d.runs = d.runs.filter(x => x.id !== id); lsSet("drs.data", JSON.stringify(d)); },
};
const store = remote ? remoteStore : localStore;

// ---------- state ----------
let state = { players: [], runs: [], pins: {} };
let loaded = false;
let me = lsGet("drs.me") || "";
// PINs this device has entered, so each player types theirs only once per device.
let myPins = {};
try { myPins = JSON.parse(lsGet("drs.pins")) || {}; } catch {}
const savePins = () => lsSet("drs.pins", JSON.stringify(myPins));
let mode = "my";
let need = +lsGet("drs.need") || 0;
let dirty = false, saveTimer = null, painting = null, teamMap = {};

function normalize(d) {
  const players = (d.players || []).map(p => {
    const slots = Array.isArray(p.slots) ? p.slots.filter(n => Number.isInteger(n) && n >= 0 && n < 168) : [];
    return { id: String(p.id), name: String(p.name || "?"), tz: validTz(p.tz), cls: p.cls || "", slots, slotSet: new Set(slots) };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const pins = {};
  for (const r of d.runs || []) if (String(r.id).startsWith(PIN_ID) && r.classes && typeof r.classes._pin === "string") pins[String(r.id).slice(PIN_ID.length)] = r.classes._pin;
  const runs = (d.runs || []).filter(r => !isNaN(Date.parse(r.start)) && !String(r.id).startsWith("_")).map(r => {
    // Loot, the "received" ticks and the leader are stored inside the `classes` column (keys _loot, _paid, _leader),
    // so the database needs no new columns. serRun() puts them back when saving.
    const { _loot, _paid, _leader, ...classes } = r.classes && typeof r.classes === "object" ? r.classes : {};
    const loot = (Array.isArray(_loot) ? _loot : []).map(it => {
      const qty = Math.min(Math.max(Math.round(+it.qty) || 1, 1), 99);
      return { id: String(it.id), name: String(it.name || "Item"), qty, price: Math.max(+it.price || 0, 0), sold: Math.min(Math.max(Math.round(+it.sold) || 0, 0), qty) };
    });
    return { id: String(r.id), name: String(r.name || "Dungeon run"), start: r.start, note: r.note || "", by: r.by || null, members: Array.isArray(r.members) ? r.members : [], classes, loot, paid: _paid && typeof _paid === "object" ? _paid : {}, leader: typeof _leader === "string" ? _leader : null };
  });
  return { players, runs, pins };
}
const serRun = r => ({ id: r.id, name: r.name, start: r.start, note: r.note, by: r.by, members: r.members, classes: { ...r.classes, _loot: r.loot, _paid: r.paid, _leader: r.leader } });
const ser = p => ({ id: p.id, name: p.name, tz: p.tz, cls: p.cls, slots: p.slots });
const nameOf = id => (state.players.find(p => p.id === id) || {}).name;

// ---------- PIN lock ----------
// This keeps teammates from changing each other's data by mistake. It is checked in the page only:
// the database itself still accepts changes from anyone who has the link.
function hashPin(id, pin) { // cyrb53, a small non-secret hash so PINs are not stored as plain digits
  const s = id + ":" + pin;
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const hasPin = id => !!state.pins[id];
const unlocked = id => hasPin(id) && state.pins[id] === hashPin(id, myPins[id] || "");
// The signed-in player: the chosen name counts only when this device knows its PIN.
const mePlayer = () => unlocked(me) ? state.players.find(p => p.id === me) : undefined;
// A run's leader. Runs made before leaders existed fall back to whoever created them.
const leaderOf = r => { const id = r.leader || r.by; return id && nameOf(id) ? id : null; };
const isLeader = r => !!mePlayer() && leaderOf(r) === me;

let pinResolve = null;
// Shows the PIN dialog. Resolves to the 4 digits, "forgot", or null when cancelled.
function askPin(title, text, forgot, err) {
  $("pinTitle").textContent = title; $("pinText").textContent = text; $("pinErr").textContent = err || "";
  $("pinInput").value = ""; $("pinForgot").hidden = !forgot;
  if (!$("pinDlg").open) $("pinDlg").showModal();
  $("pinInput").focus();
  return new Promise(resolve => { pinResolve = resolve; });
}

  if (!hasPin(id)) {
    const pin = await askPin(`Create a PIN for ${p.name}`, "Choose 4 digits and remember them. You need this PIN to change your hours, classes and runs on another device.");
    if (!pin || pin === "forgot") return false;

const picOf = name => { const p = items[itemKey(name)]; return typeof p === "string" && p.startsWith("data:image/") ? p : ""; };

// Shrinks any photo or screenshot to a small thumbnail so it is quick to load on a phone.
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 128 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let out = c.toDataURL("image/webp", 0.85);
      if (out.length > 40000) out = c.toDataURL("image/jpeg", 0.8);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
    img.src = url;
  });
}
// Price used the last time this item was looted, to prefill the next entry.
function lastPrice(name) {
  const key = itemKey(name);
  for (const r of [...state.runs].sort((x, y) => at(y) - at(x))) {
    const it = r.loot.find(x => itemKey(x.name) === key && x.price > 0);
    if (it) return it.price;
  }
  return 0;
}
function knownItemNames() {
  const seen = new Map();
  for (const r of state.runs) for (const it of r.loot) if (!seen.has(itemKey(it.name))) seen.set(itemKey(it.name), it.name);
  for (const k of Object.keys(items)) if (!seen.has(k)) seen.set(k, k);

// Accepts 50m, 500k, 1.5b, or a plain number. Returns penya, or NaN if unreadable.

function renderBest() {
  const n = state.players.length, sel = $("need");
  // Always offer 2 to 5. Until someone picks a number, default to everyone on the list.

  sel.innerHTML = [2, 3, 4, 5].map(v => `<option>${v}</option>`).join("");
  sel.value = want;
  if (n < 2) { $("best").innerHTML = '<p class="empty">Add at least two players and mark their hours to see matching times.</p>'; return; }
  if (want > n) { $("best").innerHTML = `<p class="empty">Only ${n} players are on the list, so ${want} can never be free at once. Choose a lower number or add more players.</p>`; return; }
  const wins = []; let cur = null;
  for (const h of teamHours()) {
    const key = h.who.join(",");
    if (h.who.length < want) { cur = null; continue; }
    if (cur && cur.key === key && cur.end === h.t) cur.end = h.t + HOUR;
    else wins.push(cur = { key, who: h.who, start: h.t, end: h.t + HOUR });

  wins.sort((a, b) => b.who.length - a.who.length || a.start - b.start);
  if (!wins.length) { $("best").innerHTML = `<p class="empty">No time in the next 7 days when ${want} players are free. Lower the number, or ask teammates to add more hours.</p>`; return; }
  $("best").innerHTML = wins.slice(0, 6).map(w => {
    const missing = state.players.filter(p => !w.who.includes(p.id)).map(p => p.name);
    return `<div class="item">
      <div class="title"><span class="pill ${w.who.length === n ? "good" : ""}">${w.who.length} of ${n} free</span> ${(w.end - w.start) / HOUR} hour${w.end - w.start > HOUR ? "s" : ""}</div>

  if (on) p.slotSet.add(i); else p.slotSet.delete(i);
  cell.classList.toggle("on", on);
  cell.setAttribute("aria-pressed", on);
  p.slots = [...p.slotSet].sort((a, b) => a - b);
  p.tz = browserTz;
  queueSave(p);
  renderBest();
}
function toLocalInput(ms) {
  const d = new Date(ms), z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
}
function updateWhenPreview() {
  const ms = new Date($("when").value).getTime();
  $("whenPreview").innerHTML = isNaN(ms) ? "" : dualHtml(ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  toast("Invite copied. Paste it in your group chat.");
}

$("both").checked = showBoth;
$("both").addEventListener("change", e => {
  showBoth = e.target.checked;
  lsSet("drs.both", showBoth ? "1" : "0");
  renderClocks(); updateWhenPreview(); render();
});
$("who").addEventListener("change", async e => {
  const id = e.target.value;
  if (!id) {                         // "Choose your name…" signs out and forgets the PIN on this device
    if (me) { delete myPins[me]; savePins(); }
  } else if (!(await signIn(id))) { renderWho(); return; }
  me = id; lsSet("drs.me", me); leaderTouched = false; render();
});
$("pinForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("pinInput").value;
  if (!/^\d{4}$/.test(v)) { $("pinErr").textContent = "The PIN is 4 digits."; return; }
  closePin(v);
});
$("pinCancel").addEventListener("click", () => closePin(null));
$("pinForgot").addEventListener("click", () => closePin("forgot"));
$("pinDlg").addEventListener("close", () => closePin(null)); // Esc key
$("ownerBtn").addEventListener("click", async () => {
  if (hasPin(OWNER)) return;
  const pin = await askPin("Create the owner PIN", "The owner PIN can reset a teammate's forgotten PIN. Set it once and keep it private.");
  if (!pin || pin === "forgot") return;
  await setPin(OWNER, pin);
  renderWho();
  toast("Owner PIN saved.");
});
function setMyClasses(list) {
  const p = mePlayer();
  if (!p) return;
  p.cls = list.join(" + ");
  queueSave(p);
  renderWho(); renderRuns(); renderBest();
}
$("myClass").addEventListener("change", e => {
  const p = mePlayer(), c = e.target.value;
  if (!p || !c) return;
  setMyClasses([...new Set([...splitCls(p.cls), c])]);
});
$("myClasses").addEventListener("click", e => {
  const b = e.target.closest("[data-rmcls]"), p = mePlayer();
  if (b && p) setMyClasses(splitCls(p.cls).filter(c => c !== b.dataset.rmcls));
});
$("runLeader").addEventListener("change", () => { leaderTouched = true; });
$("runs").addEventListener("change", async e => {
  const t = e.target, d = t.dataset, row = t.closest("[data-run]");
  const r = state.runs.find(x => x.id === (d.rc || d.mem || d.paid || d.lead || (row && row.dataset.run)));
  if (!r) return;
  if (d.rc) {                        // which of my classes I bring to this run
    const p = mePlayer();
    if (!p || !r.members.includes(me)) return;
    const set = new Set(splitCls(r.classes[me]));
    if (t.checked) set.add(t.value); else set.delete(t.value);
    if (!set.size) { toast("Keep at least one class for this run."); t.checked = true; return; }
    r.classes = { ...r.classes, [me]: splitCls(p.cls).filter(c => set.has(c)).join(" + ") };
    renderRuns(true);
  } else if (!isLeader(r)) {         // everything below is for the run leader only
    return;
  } else if (d.mem) {                // who shares the loot
    r.classes = { ...r.classes };
    if (t.checked) {
      const p = state.players.find(x => x.id === t.value);
      r.members = [...new Set([...r.members, t.value])];
      r.classes[t.value] = (p && splitCls(p.cls)[0]) || "";
    } else { r.members = r.members.filter(id => id !== t.value); delete r.classes[t.value]; }
    renderRuns(true);
  } else if (d.paid) {               // who has received their share
    r.paid = { ...r.paid, [t.value]: t.checked };
    renderRuns(true);
  } else if (d.lead) {               // hand leadership to another player
    if (t.value === me || !nameOf(t.value)) return;
    if (!confirm(`Make ${nameOf(t.value)} the leader of "${r.name}"? You will no longer be able to edit its loot.`)) { renderRuns(true); return; }
    r.leader = t.value;
    renderRuns(true);
  } else if (d.f) {                  // a field of an existing loot line
    const it = r.loot.find(x => x.id === row.dataset.item);
    if (!it) return;
    if (d.f === "name") {
      it.name = t.value.trim() || it.name; t.value = it.name;
      const th = row.querySelector(".thumb");
      th.innerHTML = thumbInner(it.name); th.classList.toggle("has", !!picOf(it.name));
    }
    else if (d.f === "qty") {
      it.qty = clampQty(t.value); t.value = it.qty;
      it.sold = Math.min(it.sold, it.qty);
      row.querySelector("[data-f=sold]").innerHTML = soldOptions(it);
    } else if (d.f === "price") {
      const p = parsePenya(t.value);
      if (isNaN(p)) { toast("Write the price like 50m, 500k or 1.5b."); t.value = fmtP(it.price); return; }
      it.price = p; t.value = fmtP(p);
    } else if (d.f === "sold") it.sold = Math.min(+t.value || 0, it.qty);
    updateLootView(r); // update totals in place so the next field keeps focus
  } else if (d.n === "name") {       // new item: reuse the price from the last time it dropped
    const price = row.querySelector("[data-n=price]"), last = lastPrice(t.value);
    if (!price.value && last) price.value = fmtP(last);
    return;
  } else return;
  await run(store.saveRun(serRun(r)));
});
$("picInput").addEventListener("change", async e => {
  const file = e.target.files[0], key = picKey;
  e.target.value = ""; picKey = "";
  if (!file || !key) return;
  let img;
  try { img = await shrinkImage(file); } catch { toast("That file is not a picture this browser can read."); return; }
  items = { ...items, [key]: img };
  renderRuns(true);
  await run(store.saveItem(key, img));
});
$("runs").addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.loot;
  if (id) { if (e.target.open) openLoot.add(id); else openLoot.delete(id); }
}, true);
$("runs").addEventListener("keydown", e => {
  const row = e.target.closest(".lrow.add");
  if (row && e.key === "Enter") { e.preventDefault(); row.querySelector("[data-act=lootadd]").click(); }
});
$("addPlayer").addEventListener("click", async () => {
  const name = $("newName").value.trim();
  if (!name) { $("newName").focus(); return; }
  if (state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast("That name is already on the list."); return; }
  const p = { id: uid(), name, tz: browserTz, cls: "", slots: [], slotSet: new Set() };
  state.players.push(p);
  state.players.sort((a, b) => a.name.localeCompare(b.name));
  $("newName").value = "";
  render();
  await run(store.savePlayer(ser(p)));
  // The new player creates their PIN right away; without one they are not signed in.
  if (await signIn(p.id)) { me = p.id; lsSet("drs.me", me); leaderTouched = false; render(); }
});
$("newName").addEventListener("keydown", e => { if (e.key === "Enter") $("addPlayer").click(); });
$("removeMe").addEventListener("click", async () => {
  const p = mePlayer();
  if (!p || !confirm(`Remove ${p.name} and their hours from the schedule?`)) return;
  state.players = state.players.filter(x => x.id !== p.id);
  const pins = { ...state.pins }; delete pins[p.id]; state.pins = pins;
  delete myPins[p.id]; savePins();
  me = ""; lsSet("drs.me", "");
  render();
  await run(store.deletePlayer(p.id));
  await run(store.deleteRun(PIN_ID + p.id));
});
$("need").addEventListener("change", e => { need = +e.target.value; lsSet("drs.need", need); renderBest(); });
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { mode = b.dataset.mode; renderGrid(); } });
$("clearMine").addEventListener("click", () => {
  const p = mePlayer();
  if (!p || !p.slots.length || !confirm("Clear all of your hours?")) return;
  p.slotSet.clear(); p.slots = []; queueSave(p); render();
});

const grid = $("grid");
grid.addEventListener("pointerdown", e => {
  const c = e.target.closest(".c"), p = mePlayer();
  if (!c || !p || mode !== "my" || e.pointerType !== "mouse" || e.button !== 0) return;
  e.preventDefault();
  painting = !p.slotSet.has(+c.dataset.i);
  setSlot(p, c, painting);
});
grid.addEventListener("pointerover", e => {
  if (painting === null) return;
  const c = e.target.closest(".c"), p = mePlayer();
  if (c && p) setSlot(p, c, painting);
});
window.addEventListener("pointerup", () => { painting = null; });
grid.addEventListener("click", e => {
  const c = e.target.closest(".c");
  if (!c) return;
  const i = +c.dataset.i;
  if (mode === "team") {
    const names = (teamMap[i] || []).map(nameOf).filter(Boolean);
    $("gridHint").textContent = `${DOW[Math.floor(i / 24)]} ${hl(i % 24)}: ${names.length ? names.join(", ") + " free" : "nobody free"}`;
    return;
  }
  if (e.pointerType === "mouse") return; // mouse is handled by pointerdown so dragging can paint
  const p = mePlayer();
  if (p) setSlot(p, c, !p.slotSet.has(i));
});

$("best").addEventListener("click", e => {
  const b = e.target.closest("[data-plan]");
  if (!b) return;
  $("when").value = toLocalInput(+b.dataset.plan);
  updateWhenPreview();
  $("runForm").scrollIntoView({ behavior: "smooth", block: "center" });
  $("runName").focus({ preventScroll: true });
});
$("when").addEventListener("input", updateWhenPreview);
$("runForm").addEventListener("submit", async e => {
  e.preventDefault();
  const ms = new Date($("when").value).getTime();
  if (isNaN(ms)) { toast("Pick a start time first."); return; }
  const p = mePlayer();
  if (!p) { toast("Choose your name and enter your PIN before creating a run."); return; }
  const leader = nameOf($("runLeader").value) ? $("runLeader").value : me;
  const r = { id: uid(), name: $("runName").value.trim() || "Dungeon run", start: new Date(ms).toISOString(), note: $("runNote").value.trim(), by: me, leader, members: [me], classes: { [me]: splitCls(p.cls)[0] || "" }, loot: [], paid: {} };
  state.runs.push(r);
  $("runName").value = ""; $("runNote").value = "";
  leaderTouched = false; renderWho();
  renderRuns();
  await run(store.saveRun(serRun(r)));
});
$("runs").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const r = state.runs.find(x => x.id === b.dataset.id);
  if (!r) return;
  const act = b.dataset.act;
  if (["lootadd", "lootpic", "lootdel", "del"].includes(act) && !isLeader(r)) return; // leader only
  if (act === "lead") {              // a run without a leader can be claimed by any signed-in player
    if (!mePlayer() || leaderOf(r)) return;
    r.leader = me;
    renderRuns(true);
    return run(store.saveRun(serRun(r)));
  }
  if (act === "lootadd") {
    const row = b.closest(".lrow"), get = n => row.querySelector(`[data-n=${n}]`).value.trim();
    const name = get("name"), price = get("price") ? parsePenya(get("price")) : 0;
    if (!name) { row.querySelector("[data-n=name]").focus(); return; }
    if (isNaN(price)) { toast("Write the price like 50m, 500k or 1.5b."); return; }
    r.loot = [...r.loot, { id: uid(), name, qty: clampQty(get("qty")), price, sold: 0 }];
    openLoot.add(r.id);
    renderRuns(true);
    return run(store.saveRun(serRun(r)));
  }
  if (act === "lootpic") {
    const it = r.loot.find(x => x.id === b.dataset.item);
    if (!it) return;
    picKey = itemKey(it.name);
    $("picInput").click();
    return;
  }
  if (act === "lootdel") {
    const it = r.loot.find(x => x.id === b.dataset.item);
    if (!it || !confirm(`Remove ${it.name} from the loot list?`)) return;
    r.loot = r.loot.filter(x => x !== it);
    renderRuns(true);
    return run(store.saveRun(serRun(r)));
  }
  if (act === "copy") {
    const link = location.protocol.startsWith("http") ? "\n" + location.href : "";
    const going = r.members.map(id => tag(id, r)).filter(Boolean);
    return copyText(`${r.name}\n${dualText(at(r))}${r.note ? "\n" + r.note : ""}${leaderOf(r) ? "\nLeader: " + nameOf(leaderOf(r)) : ""}${going.length ? "\nGoing: " + going.join(", ") : ""}${link}`);
  }
  if (act === "del") {
    if (!confirm(`Delete "${r.name}"?`)) return;
    state.runs = state.runs.filter(x => x.id !== r.id);
    renderRuns();
    return run(store.deleteRun(r.id));
  }
  if (!mePlayer()) return;
  r.classes = { ...r.classes };
  if (act === "join") { r.members = [...new Set([...r.members, me])]; r.classes[me] = splitCls(mePlayer().cls)[0] || ""; }
  else { r.members = r.members.filter(id => id !== me); delete r.classes[me]; }
  renderRuns();
  await run(store.saveRun(serRun(r)));
});

// ---------- start ----------
$("banner").hidden = remote;
$("when").value = toLocalInput(Math.ceil(Date.now() / HOUR) * HOUR);
updateWhenPreview();
renderClocks();
refresh();
loadItems();
setInterval(() => { renderClocks(); renderRuns(); }, 30000);
if (remote) {
  setInterval(refresh, 30000);
  setInterval(loadItems, 5 * 60000); // pictures change rarely
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); loadItems(); } });
}
</script>
</body>
